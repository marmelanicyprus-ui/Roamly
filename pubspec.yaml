name: roamly
description: Roamly offline — приложение для поездок компаний и гидов, работает без интернета.
publish_to: 'none'
version: 0.2.0+4

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  app_links: ^6.4.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^14.0.0
  nearby_connections: ^4.3.0
  permission_handler: ^12.0.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
