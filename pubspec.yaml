name: roamly
description: Roamly offline — приложение для поездок компаний и гидов, работает без интернета.
publish_to: 'none'
version: 0.8.1+12

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  app_links: ^6.4.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^14.0.0
  nearby_connections: ^4.3.0
  permission_handler: ^12.0.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  web_socket_channel: '>=2.4.0 <4.0.0'
  http: any
  livekit_client: ^2.4.0
  firebase_core: any
  firebase_messaging: any
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  fc_native_video_thumbnail: ^4.0.0
  video_player: ^2.9.2
  camera: ^0.12.0
  record: ^7.2.0
  gal: ^3.0.1
  open_filex: ^5.0.0
  file_selector: ^1.0.3
  maplibre_gl: ^0.27.1
  battery_plus: '>=6.0.0 <8.0.0'
  ota_update: ^7.1.0
  package_info_plus: '>=8.0.0 <10.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
