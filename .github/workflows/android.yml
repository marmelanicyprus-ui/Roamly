name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (first time)
        run: |
          if [ ! -d android ]; then
            flutter create --org com.roamlyoffline --project-name roamly --platforms=android .
            rm -rf test
          fi
          # App name on the phone
          sed -i 's/android:label="[^"]*"/android:label="Roamly offline"/' android/app/src/main/AndroidManifest.xml
          # Deep link roamly://join — opens the app from a QR scanned by the phone camera
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android:scheme="roamly"' $M; then
            sed -i 's#</activity>#    <meta-data android:name="flutter_deeplinking_enabled" android:value="false"/>\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW"/>\n                <category android:name="android.intent.category.DEFAULT"/>\n                <category android:name="android.intent.category.BROWSABLE"/>\n                <data android:scheme="roamly" android:host="join"/>\n            </intent-filter>\n        </activity>#' $M
          fi
          # Internet (map tiles) and location permissions
          if ! grep -q 'ACCESS_FINE_LOCATION' $M; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' $M
          fi
          # Allow opening the phone dialer (SOS 112)
          if ! grep -q 'android.intent.action.DIAL' android/app/src/main/AndroidManifest.xml; then
            sed -i 's#<queries>#<queries>\n        <intent><action android:name="android.intent.action.DIAL"/><data android:scheme="tel"/></intent>#' android/app/src/main/AndroidManifest.xml
          fi

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Signing key (stable, so new versions install over old ones)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Тестовый ключ хранится в служебном релизе signing-key; создаётся один раз
          mkdir -p ~/.android ci
          if ! gh release download signing-key -p debug.keystore -D ci 2>/dev/null; then
            keytool -genkeypair -keystore ci/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Roamly Test,O=Roamly offline,C=CY"
            gh release upload signing-key ci/debug.keystore --clobber
          fi
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: roamly-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish APK to GitHub Release (direct link for phones)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          TAG="v$VERSION"
          cp build/app/outputs/flutter-apk/app-release.apk "roamly-$VERSION.apk"
          cp "roamly-$VERSION.apk" roamly.apk
          # Релиз android создан заранее: https://github.com/$GITHUB_REPOSITORY/releases/download/android/roamly.apk
          gh release upload android "roamly-$VERSION.apk" roamly.apk --clobber
